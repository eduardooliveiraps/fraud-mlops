# CI: lint + unit tests on every push and pull request, then the whole loop (Terraform-built
# kind cluster, MLflow, training Job + gate, deploy, live API checks) with synthetic data.
# Pushes to main publish the image that passed the smoke test to GHCR.
# Actions are pinned by commit SHA (a tag can be moved; a SHA cannot); the version is in a comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # least privilege; the smoke job adds packages: write for the push

concurrency:  # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install PY=python
      - run: make lint
      - run: make test

  smoke:
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write  # used only by the push steps, which run only on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install PY=python
      - run: make tools
      - name: Terraform format and validate
        run: make tf-check
      - name: Synthetic training data (the real dataset is never in CI)
        run: .venv/bin/python -m fraud.data --config configs/config.yaml --synthetic 20000
      - name: MLflow storage writable by the MLflow pod
        # The pod runs as uid 1000 (the owner's laptop user); the runner user is uid 1001.
        run: mkdir -p .state/mlflow && chmod 0777 .state/mlflow
      - name: Cluster with Terraform (monitoring off in CI)
        run: make cluster-up MONITORING=false
      - run: make mlflow-up
      - run: make image
      - run: make train-deploy
      - name: Training Job in the cluster (validate, train, register, gate)
        run: make train-job
      - run: make deploy
      - name: Live API checks
        run: make smoke

      - name: Diagnostics
        if: failure()
        run: |
          K="$HOME/.local/bin/kubectl --context kind-fraud"
          $K get pods,jobs -A -o wide || true
          $K -n fraud get events --sort-by=.lastTimestamp | tail -40 || true
          $K -n fraud logs -l app=fraud-api --tail=50 --prefix || true
          $K -n fraud logs -l app=fraud-train --tail=50 --prefix || true

      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make push REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
