# Single source of paths and settings. Relative paths are resolved from the working
# directory (run commands from the repo root).
data:
  raw_csv: data/raw/Base.csv
  parquet: data/processed/base.parquet

# Time-based split by `month` (0-7): train on the past, test on the future.
split:
  train_months: [0, 1, 2, 3, 4]
  valid_months: [5]  # early stopping and threshold choice
  test_months: [6, 7]  # final metrics and the champion/challenger gate

evaluation:
  target_fpr: 0.05  # recall is reported at this false-positive rate (BAF paper benchmark)
  # Assumed relative costs: a missed fraud costs 20x a false alarm (manual review).
  cost_false_negative: 20.0
  cost_false_positive: 1.0

train:
  seed: 42
  n_jobs: 4  # fixed thread count: part of reproducibility (and leaves CPU for the cluster)
  early_stopping_rounds: 100  # on valid PR-AUC
  # LGBMClassifier hyperparameters (fixed, no search). Seed, threads, metric and
  # determinism flags are set by the code and are not allowed here.
  params:
    n_estimators: 2000
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8

mlflow:  # the server address comes from the MLFLOW_TRACKING_URI environment variable
  experiment: fraud-baf
  model_name: fraud-lgbm
  champion_alias: champion

gate:  # the new model replaces the champion only if, on the same test months:
  min_recall_gain: 0.005  # recall at target_fpr improves by at least this much
  max_pr_auc_drop: 0.005  # and PR-AUC drops by at most this much

monitoring:
  psi_bins: 10  # quantile bins of test-month scores, the PSI reference for serving
  psi_window: 1000  # serving: PSI over the last N scores per pod (NaN until N are seen)
