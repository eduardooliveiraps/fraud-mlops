# fraud-api.fraud.svc.cluster.local:8000 in the cluster; NodePort 30800 -> localhost:8000.
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  namespace: fraud
spec:
  type: NodePort
  selector:
    app: fraud-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
