# One-node local cluster (control plane also runs our pods) to keep RAM low.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraMounts:
      # Host folder -> node folder; the MLflow PersistentVolume points at the node folder.
      - hostPath: .state/mlflow
        containerPath: /mnt/mlflow
      # Training data, read-only: the Job reads it, nothing in the cluster can change it.
      - hostPath: data/processed
        containerPath: /mnt/data
        readOnly: true
    extraPortMappings:
      # localhost:5000 -> MLflow Service NodePort. 127.0.0.1 keeps it off the local network.
      - containerPort: 30500
        hostPort: 5000
        listenAddress: 127.0.0.1
      # localhost:8000 -> scoring API Service NodePort.
      - containerPort: 30800
        hostPort: 8000
        listenAddress: 127.0.0.1
      # localhost:9090 -> Prometheus, localhost:3000 -> Grafana.
      - containerPort: 30900
        hostPort: 9090
        listenAddress: 127.0.0.1
      - containerPort: 30300
        hostPort: 3000
        listenAddress: 127.0.0.1
