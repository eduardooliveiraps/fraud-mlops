[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-mlops"
version = "0.1.0"
requires-python = ">=3.11"
# Supported ranges; exact versions live in requirements*.lock (`make lock`).
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.4,<3",
    "pyarrow>=25,<26",
    "scikit-learn>=1.9,<2",
    "lightgbm>=4.7,<5",
    # Client only (no server). Must match the server image in k8s/mlflow; bump together.
    "mlflow-skinny>=3.16.1,<3.17",
    "skops>=0.16,<0.17",  # MLflow saves/loads the LightGBM sklearn model with skops (not pickle)
    "pyyaml>=6.0,<7",
    "pandera[pandas]>=0.33.1,<0.34",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.53,<0.55",
    "prometheus-client>=0.26,<0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<0.29",  # FastAPI's TestClient
    "locust>=2.40,<3",  # load test (make loadtest)
    "ruff>=0.16,<0.17",
    "ipykernel>=6,<8",
    "matplotlib>=3.10,<4",
    "mlflow>=3.16.1,<3.17",  # full package: tests use a throwaway SQLite tracking store
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["loadtest"]  # tests import loadtest/payloads.py (not locustfile: locust patches stdlib)

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]  # enforce line-length (not in ruff's default rules)

[tool.ruff.lint.per-file-ignores]
# Bad config file content is a ValueError (bad value), not a TypeError (caller bug).
"src/fraud/config.py" = ["TRY004"]
