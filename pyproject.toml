[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "pyarrow", "scikit-learn", "lightgbm", "mlflow", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyterlab", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
